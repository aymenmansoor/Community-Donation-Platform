server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ { proxy_pass http://api:5000; }
    location /uploads/ { proxy_pass http://api:5000; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /static/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
