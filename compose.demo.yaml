# Preparation template only. Bindings stay local until a TLS gateway is configured.
services:
  mongo:
    image: mongo@sha256:4b58ebcb1dc7a7b4e84cd8ce9098d48764ae4478876898ff9551acf2ac4a6a6d
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER privately}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD privately}
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER privately}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Use a random hex password}
    volumes:
      - demo-mongo:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-app.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.runCommand({ping:1}).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      MONGO_NETWORK: private
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/community_donation?authSource=community_donation
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set the approved HTTPS frontend origin}
    volumes:
      - demo-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_URL: ''
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  demo-mongo:
  demo-uploads:
